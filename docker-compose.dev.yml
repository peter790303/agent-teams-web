services:
  agent-teams-web:
    build:
      context: .
      dockerfile: docker/22/Dockerfile.dev
    ports:
      - "127.0.0.1:30679:30679"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:30678}
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 30679

volumes:
  web_node_modules:
